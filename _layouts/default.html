<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/primer/19.1.1/build.css">
  <style>
    body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
    @media (max-width: 767px) { body { padding: 15px; } }
    @media (prefers-color-scheme: dark) {
      body { background-color: #0d1117; }
      .markdown-body { background-color: #0d1117; color: #c9d1d9; }
      .markdown-body a { color: #58a6ff; }
      .markdown-body code { background-color: rgba(110,118,129,0.4); }
      .markdown-body pre { background-color: #161b22; }
      .markdown-body blockquote { border-left-color: #30363d; color: #8b949e; }
      .markdown-body table th, .markdown-body table td { border-color: #30363d; }
      .markdown-body hr { background-color: #30363d; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  <div class="markdown-body">
    {{ content }}
  </div>
</body>
</html>
